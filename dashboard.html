<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneCare Patient Portal – Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Open Sans',sans-serif;background:#ECF0F9;min-height:100vh;overflow-x:hidden;}
:root{--nav-height:75px;--sidebar-width:260px;}

/* PAGE LOAD ANIMATIONS */
@keyframes fadeSlideDown{from{opacity:0;transform:translateY(-16px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeSlideLeft{from{opacity:0;transform:translateX(-24px);}to{opacity:1;transform:translateX(0);}}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

/* TOP NAV */
.top-nav{position:fixed;top:0;left:0;right:0;height:var(--nav-height);background:#fff;box-shadow:0px 1.558px 4.675px rgba(0,0,0,.1),0px 1.558px 3.116px -1.558px rgba(0,0,0,.1);display:flex;align-items:center;padding:0 24px 0 28px;z-index:100;animation:fadeSlideDown 0.45s cubic-bezier(0.22,1,0.36,1) both;}
.logo-area{display:flex;align-items:center;gap:8px;flex-shrink:0;width:228px;cursor:pointer;border-radius:8px;padding:4px;transition:background .18s;}
.logo-area:hover .logo-name .one,.logo-area:hover .logo-name .care,.logo-area:hover .logo-subtitle{color:#B3B8CB;}
.logo-svg-stroke{transition:stroke .18s;}
.logo-svg-fill{transition:fill .18s;}
.logo-area:hover .logo-svg-stroke{stroke:#B3B8CB;}
.logo-area:hover .logo-svg-fill{fill:#B3B8CB;}
.logo-name .one, .logo-name .care, .logo-subtitle{transition:color .18s;}
.logo-icon{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:36px;height:44px;}
.logo-text{display:flex;flex-direction:column;}
.logo-name{font-family:'Satoshi','Open Sans',sans-serif;font-size:28px;line-height:1;letter-spacing:-0.5px;}
.logo-name .one{font-weight:400;color:#0B1956;}
.logo-name .care{font-weight:700;color:#0B1956;}
.logo-subtitle{font-family:'Open Sans',sans-serif;font-size:14px;font-weight:400;color:#0B1956;line-height:1.4;}
.nav-center{flex:1;display:flex;justify-content:flex-start;padding-left:40px;}
.welcome-text{font-family:'Open Sans',sans-serif;font-weight:700;font-size:28px;line-height:40px;color:#0B1956;white-space:nowrap;}
.nav-right{display:flex;align-items:center;gap:16px;flex-shrink:0;margin-left:auto;}
.search-bar{display:flex;align-items:center;width:280px;height:44px;background:#EAEBEA;border-radius:28px;padding:0 16px;gap:8px;}
.search-input{flex:1;height:auto;background:transparent;border:none;outline:none;padding:0;font-family:'Open Sans',sans-serif;font-weight:400;font-size:14px;color:#49454F;letter-spacing:0;}
.search-input::placeholder{color:#49454F;font-weight:400;}
.search-icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.bell-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;transition:transform .18s;}
.bell-btn:hover{transform:scale(1.1);}

/* SIDEBAR */
.sidebar{position:fixed;left:0;top:var(--nav-height);width:var(--sidebar-width);height:calc(100vh - var(--nav-height));background:#0B1956;box-shadow:0px 15.582px 23.373px -4.675px rgba(0,0,0,.1);display:flex;flex-direction:column;overflow:hidden;z-index:50;animation:fadeSlideLeft 0.5s cubic-bezier(0.22,1,0.36,1) 0.15s both;}
.sidebar-nav{padding:16px 16px 8px;display:flex;flex-direction:column;gap:2px;flex:1;}
.nav-item{display:flex;align-items:center;gap:14px;padding:12px 20px;height:auto;border-radius:10px;cursor:pointer;}
.nav-item.active{background:#fff;box-shadow:0px 15.582px 23.373px -4.675px rgba(0,0,0,.1),0px 6.233px 9.349px -6.233px rgba(0,0,0,.1);border-radius:10px;}
.nav-item:not(.active):hover{background:rgba(255,255,255,.08);border-radius:8px;}
.nav-icon{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.nav-label{font-family:'Open Sans',sans-serif;font-weight:400;font-size:15px;line-height:24px;letter-spacing:.15px;color:#E7E8EE;}
.nav-item.active .nav-label{font-weight:700;color:#0B1956;}
.sidebar-footer{border-top:.866px solid #E5E7EB;padding:12px 16px;}
.user-info{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.user-avatar{width:48px;height:48px;background:#B3B8CB;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.user-details{display:flex;flex-direction:column;}
.user-name{font-family:'Open Sans',sans-serif;font-weight:700;font-size:16px;line-height:1.2;color:#fff;}
.user-id{font-family:'Open Sans',sans-serif;font-weight:400;font-size:13px;line-height:25px;color:#B3B8CB;}
.logout-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:auto;padding:10px 16px;border:1px solid #fff;border-radius:10px;cursor:pointer;margin-bottom:12px;transition:background .18s;}
.logout-btn:hover{background:rgba(255,255,255,.1);}
.logout-label{font-family:'Open Sans',sans-serif;font-weight:500;font-size:14px;line-height:24px;letter-spacing:.15px;color:#fff;}

/* MAIN CONTENT */
.main-content{margin-left:var(--sidebar-width);margin-top:var(--nav-height);padding:36px 36px 40px 36px;min-height:calc(100vh - var(--nav-height));}

/* REGISTRATION SUCCESS HEADING */
.reg-success-heading{font-family:'Open Sans',sans-serif;font-weight:700;font-size:24px;line-height:32px;color:#0B1956;margin-bottom:16px;}

/* PROGRESS CARD */
.progress-card{background:#fff;box-shadow:0px 4px 6px -1px rgba(0,0,0,.1),0px 2px 4px -2px rgba(0,0,0,.1);border-radius:10px;padding:24px 24px 0px;margin-bottom:40px;width:100%;max-width:904px;animation:fadeSlideUp 0.5s cubic-bezier(0.22,1,0.36,1) 0.3s both;}
.progress-card-inner{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#B3B8CB #f0f0f0;padding-bottom:0;}
.progress-card-inner::-webkit-scrollbar{display:block;height:5px;}
.progress-card-inner::-webkit-scrollbar-track{background:#f0f0f0;border-radius:4px;}
.progress-card-inner::-webkit-scrollbar-thumb{background:#B3B8CB;border-radius:4px;}

/* STEP COUNTER ROW */
.step-counter-row{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:8px;}
.step-counter-label{font-family:'Open Sans',sans-serif;font-weight:700;font-size:16px;line-height:24px;letter-spacing:.15px;color:#0B1956;}
.step-percent{font-family:'Open Sans',sans-serif;font-weight:700;font-size:16px;line-height:24px;letter-spacing:.15px;color:#0B1956;}

/* PROGRESS BAR */
.progress-bar-track{width:100%;height:12px;background:#E5E7EB;border-radius:9999px;margin-bottom:16px;overflow:hidden;}
.progress-bar-fill{height:12px;background:#5C658E;border-radius:9999px;width:100%;}

/* STEP INDICATORS */
.step-indicators{display:flex;flex-direction:row;justify-content:space-between;align-items:flex-start;width:100%;padding-bottom:24px;}
.step-indicator{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;}
.step-circle-num{width:32px;height:32px;border-radius:50%;background:#3C4778;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-circle-num span{font-family:'Open Sans',sans-serif;font-weight:400;font-size:16px;line-height:24px;text-align:center;letter-spacing:.15px;color:#fff;}
.step-name{font-family:'Open Sans',sans-serif;font-weight:600;font-size:12px;line-height:16px;text-align:center;letter-spacing:.5px;color:#303231;}

/* CONSULTATION SECTION */
.consultation-section{max-width:904px;animation:fadeSlideUp 0.5s cubic-bezier(0.22,1,0.36,1) 0.45s both;}
.consult-heading{font-family:'Open Sans',sans-serif;font-weight:700;font-size:24px;line-height:32px;color:#0B1956;margin-bottom:8px;}
.consult-subheading{font-family:'Open Sans',sans-serif;font-weight:700;font-size:16px;line-height:24px;letter-spacing:.15px;color:#595B5A;margin-bottom:6px;}
.consult-steps{display:flex;flex-direction:column;gap:6px;margin-bottom:24px;}
.consult-step-item{font-family:'Open Sans',sans-serif;font-weight:400;font-size:16px;line-height:24px;letter-spacing:.15px;color:#595B5A;}

/* START BUTTON */
.start-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:116px;height:56px;background:#0B1956;border-radius:16px;cursor:pointer;border:none;outline:none;transition:background .18s,transform .1s;}
.start-btn:hover{background:#1a2d6b;transform:scale(1.02);}
.start-btn:active{transform:scale(0.98);}
.start-btn-label{font-family:'Roboto',sans-serif;font-weight:500;font-size:16px;line-height:24px;letter-spacing:.15px;color:#fff;}

/* CHAT BUBBLE */
.chat-bubble{position:fixed;right:32px;bottom:40px;width:64px;height:64px;background:#fff;border-radius:50%;box-shadow:0px 1.216px 2.432px -1.216px rgba(0,0,0,.1),0px 1.216px 3.649px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:200;transition:transform .18s;animation:fadeSlideUp 0.45s cubic-bezier(0.22,1,0.36,1) 0.6s both;}
.chat-bubble:hover{transform:scale(1.08);}

/* HAMBURGER TOGGLE */
.menu-toggle{display:none;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:40px;height:40px;cursor:pointer;border:none;background:transparent;padding:4px;border-radius:8px;flex-shrink:0;transition:background .18s;}
.menu-toggle:hover{background:#f0f2f9;}
.menu-toggle span{display:block;width:22px;height:2px;background:#0B1956;border-radius:2px;transition:all .3s;}
.menu-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.menu-toggle.open span:nth-child(2){opacity:0;}
.menu-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

/* OVERLAY */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:49;opacity:0;pointer-events:none;transition:opacity .3s;}
.sidebar-overlay.active{opacity:1;pointer-events:all;}

/* ── DESKTOP 1101–1400px ── */
@media(max-width:1400px){
  .main-content{padding:28px 28px 40px 28px;}
}

/* ── COLLAPSIBLE SIDEBAR: ≤1100px ── */
@media(max-width:1100px){
  .menu-toggle{display:flex;}
  .nav-center{display:none;}
  .search-bar{width:200px;}
  .sidebar{
    transform:translateX(-100%);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
    box-shadow:none;
    animation:none;
  }
  .sidebar.open{
    transform:translateX(0);
    box-shadow:6px 0 32px rgba(0,0,0,.2);
  }
  .sidebar-overlay{display:block;}
  .main-content{margin-left:0;padding:28px 24px 40px 24px;}
}

/* ── TABLET: ≤899px ── */
@media(max-width:899px){
  :root{--nav-height:64px;}
  .top-nav{padding:8px 16px;}
  .logo-icon{width:36px;height:44px;}
  .logo-icon svg{width:36px;height:44px;}
  .logo-name{font-size:22px;line-height:30px;}
  .logo-subtitle{font-size:13px;line-height:18px;}
  .logo-area{width:auto;}
  .search-bar{width:40px;height:40px;border-radius:50%;padding:0;justify-content:center;}
  .search-input{display:none;}
  .search-icon-btn{width:40px;height:40px;}
  .bell-btn{width:44px;height:44px;}
  .sidebar{width:300px;}
  .logout-btn{width:calc(300px - 50px);}
  .main-content{margin-left:0;padding:20px 16px 40px 16px;}
  .progress-card{max-width:100%;}
  .consultation-section{max-width:100%;}
  .step-name{font-size:10px;}
}

/* ── MOBILE: ≤600px ── */
@media(max-width:600px){
  :root{--nav-height:56px;}
  .top-nav{padding:6px 12px;gap:6px;}
      .logo-icon{width:26px;height:32px;}
      .logo-icon svg{width:26px;height:32px;}
      .logo-name{font-size:18px;line-height:24px;}
      .logo-subtitle{font-size:11px;line-height:16px;}
      .nav-right{gap:6px;}
      .search-bar{width:34px;height:34px;border-radius:50%;padding:0;justify-content:center;}
      .search-input{display:none;}
      .search-icon-btn{width:34px;height:34px;}
      .bell-btn{width:34px;height:34px;}
      .bell-btn svg{width:20px;height:20px;}
       .sidebar {
    top: var(--nav-height);
    height: calc(100vh - var(--nav-height));
    width: var(--sidebar-width);
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    z-index: 50;
    animation: none;} /* disable load animation on mobile — drawer handles its own transform */
  .main-content{margin-left:0;padding:12px 12px 32px 12px;}
  .reg-success-heading{font-size:18px;}
  .progress-card{padding:14px 14px 0px;}
  .step-counter-label{font-size:13px;}
  .step-percent{font-size:13px;}
  .step-circle-num{width:26px;height:26px;}
  .step-circle-num span{font-size:13px;}
  .step-name{font-size:9px;}
  .consult-heading{font-size:18px;}
  .consult-subheading{font-size:14px;}
  .consult-step-item{font-size:14px;}
  .chat-bubble{right:14px;bottom:18px;width:50px;height:50px;}
  .chat-bubble svg{width:22px;height:22px;}
}

a.nav-item{color:inherit}
/* icon colours follow the active state on every page */
.nav-item:not(.active) svg [stroke="#0B1956"]{stroke:#E7E8EE}
.nav-item:not(.active) svg [fill="#0B1956"]{fill:#E7E8EE}
.nav-item.active svg [stroke="#E7E8EE"]{stroke:#0B1956}
.nav-item.active svg [fill="#E7E8EE"]{fill:#0B1956}
.bell-dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:#FB2C36;border:2px solid #fff}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#050B24;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:300}
.toast.show{opacity:1;transform:translate(-50%,0)}
a.nav-item.is-locked .nav-label::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#8A90B1;margin-left:8px;vertical-align:middle}

/* ===== Consultation summary (after the video consultation) ===== */
.sum-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;max-width:1100px}
.sum-badge{display:inline-flex;align-items:center;gap:6px;background:#E8F5EC;color:#1F7A3E;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:8px}
.sum-sub{font-size:14px;color:#595B5A;margin-top:2px}
.sum-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;max-width:1100px}
.sum-card{background:#fff;border-radius:10px;box-shadow:0px 4px 6px -1px rgba(0,0,0,.1),0px 2px 4px -2px rgba(0,0,0,.1);padding:22px 24px;animation:fadeSlideUp .5s cubic-bezier(.22,1,.36,1) both}
.sum-card h3{font-size:18px;line-height:26px;font-weight:700;color:#0B1956;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.sum-doc{display:flex;gap:14px;align-items:center;background:#F6F3FA;border-radius:10px;padding:14px 16px;margin-bottom:16px}
.sum-doc img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.sum-doc b{display:block;font-size:15px;color:#0B1956}.sum-doc span{font-size:13px;color:#595B5A}
.sum-meta{margin-left:auto;text-align:right;font-size:13px;color:#595B5A}.sum-meta b{font-size:14px;color:#303231}
.sum-row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:10px 0;border-top:1px solid #EEF0F5;font-size:14px;line-height:22px;color:#303231}
.sum-row:first-of-type{border-top:0}.sum-row dt{color:#595B5A;font-weight:600}
.sum-list{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px;color:#303231}
.sum-list li{display:flex;gap:10px;align-items:flex-start;line-height:22px}
.sum-list li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:#5C658E;margin-top:7px}
.sum-cost{background:#ECF0F9;border-radius:10px;padding:14px 16px;margin:14px 0 18px}
.sum-cost small{font-size:12px;color:#595B5A}.sum-cost b{display:block;font-size:22px;color:#0B1956;margin-top:2px}
.sum-next{counter-reset:n;list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.sum-next li{counter-increment:n;display:flex;gap:10px;align-items:center;font-size:14px;color:#303231}
.sum-next li::before{content:counter(n);width:24px;height:24px;border-radius:50%;background:#3C4778;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.sum-next li.todo::before{background:#E5E7EB;color:#6B7280}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border:1px solid #0B1956;border-radius:12px;background:#fff;color:#0B1956;font-family:'Roboto',sans-serif;font-weight:500;font-size:14px;text-decoration:none;cursor:pointer}
.btn-ghost:hover{background:#F0F2F9}
@media(max-width:1100px){.sum-grid{grid-template-columns:1fr}}
@media(max-width:600px){.sum-row{grid-template-columns:1fr;gap:2px}.sum-head{flex-direction:column}.sum-doc{flex-wrap:wrap}.sum-meta{margin-left:0;text-align:left}}

/* ===== Added for pre-registration state, AI card, pop-over (matches jury dashboard style) ===== */
.dash-grid{display:grid;grid-template-columns:minmax(0,904px) 320px;gap:28px;align-items:start}
.dash-grid .progress-card{margin-bottom:32px}
.step-circle-num.todo{background:#E5E7EB}.step-circle-num.todo span{color:#9CA3AF}
.step-circle-num.current{background:#8A90B1}
.step-indicator.todo .step-name{color:#9CA3AF;font-weight:400}
.consult-step-item.done{color:#2F7A4B;text-decoration:line-through;text-decoration-color:rgba(47,122,75,.45)}
ol.consult-steps{list-style:decimal;padding-left:20px}
a.start-btn{display:inline-flex;text-decoration:none;width:auto;min-width:116px;padding:0 24px}
.ai-card{background:#fff;border-radius:10px;box-shadow:0px 4px 6px -1px rgba(0,0,0,.1),0px 2px 4px -2px rgba(0,0,0,.1);padding:28px;animation:fadeSlideUp 0.5s cubic-bezier(0.22,1,0.36,1) 0.4s both}
.ai-card h3{font-family:'Open Sans',sans-serif;font-weight:700;font-size:22px;line-height:30px;color:#0B1956}
.ai-card p{font-size:15px;line-height:24px;color:#595B5A;margin:10px 0 18px}
.intent-banner{display:block;background:#fff;border-left:4px solid #0B1956;border-radius:10px;padding:14px 18px;margin-bottom:20px;font-size:15px;color:#0B1956;box-shadow:0px 2px 4px -2px rgba(0,0,0,.1);max-width:904px}
.chat-bubble{border:0}
.fab-pop{position:fixed;right:110px;bottom:70px;width:220px;background:#fff;border-radius:10px;box-shadow:0 10px 28px rgba(11,25,86,.16);padding:18px 20px;z-index:201;opacity:0;visibility:hidden;transform:translateY(8px);transition:.2s}
.fab-pop.open{opacity:1;visibility:visible;transform:none}
.fab-pop b{display:block;font-size:15px;line-height:22px;color:#0B1956}
.fab-pop a{display:block;font-size:14px;color:#595B5A;margin-top:8px;text-decoration:none}
.fab-pop a:hover{color:#0B1956;text-decoration:underline}
@media(max-width:1300px){.dash-grid{grid-template-columns:1fr}.ai-card{max-width:904px}}
@media(max-width:600px){.fab-pop{right:14px;bottom:80px}}
</style>
<style id="oc-type">
/* ===== OneCare portal type scale (shared across every dashboard screen) =====
   H1 page title 26px · H2 section 20px · H3 card title 18px · body 14px · caption 12px */
:root{--oc-h1:26px;--oc-h2:20px;--oc-h3:18px;--oc-body:14px;--oc-cap:12px}
/* Dashboard (dashboard-screen.html + dashboard.html) — was 24px headings / 16px body */
.reg-success-heading,.consult-heading{font-size:var(--oc-h2)!important;line-height:28px!important}
.reg-success-heading{margin-bottom:14px!important}
.consult-subheading{font-size:var(--oc-body)!important;line-height:22px!important;margin-bottom:6px!important}
.consult-step-item{font-size:var(--oc-body)!important;line-height:22px!important}
.consult-steps{gap:4px!important;margin-bottom:20px!important}
.step-counter-label,.step-percent{font-size:var(--oc-body)!important}
.step-circle-num{width:28px!important;height:28px!important}
.step-circle-num span{font-size:13px!important}
.step-name{font-size:var(--oc-cap)!important}
.progress-card{padding:20px 20px 0!important;margin-bottom:28px!important}
.step-indicators{padding-bottom:18px!important}
.start-btn{height:48px!important;border-radius:12px!important}
.start-btn-label{font-size:var(--oc-body)!important}
.ai-card h3{font-size:var(--oc-h3)!important;line-height:26px!important}
.ai-card p{font-size:var(--oc-body)!important;line-height:22px!important}
/* H1 page titles */

<style id="oc-responsive">
/* ===================================================================
   OneCare portal — shared responsive rules (all after-login screens)
   Breakpoints:  ≤1100px tablet/laptop · ≤899px tablet · ≤600px phone
   =================================================================== */
html,body{max-width:100%;overflow-x:hidden}
img,video,canvas{max-width:100%}

@media (max-width:1100px){
  /* Sidebar becomes an off-canvas drawer opened by the ☰ button.
     (The page-load slide-in animation used to keep it on screen.) */
  .sidebar,#sidebar{animation:none!important;transform:translateX(-100%)!important;transition:transform .3s cubic-bezier(.4,0,.2,1)!important;z-index:150!important}
  .sidebar.open,#sidebar.open{transform:translateX(0)!important;box-shadow:6px 0 32px rgba(0,0,0,.2)!important}
  .main-content,.main,main.main-content{margin-left:0!important;max-width:100%!important;min-width:0!important}
  .menu-toggle,#menuToggle{display:flex!important}
  .nav-center{display:none!important}
  .top-nav{gap:10px}
}
@media (max-width:1100px){
  /* Journey tabs (Discharge / Post Care / After discharge): one scrollable row */
  .stage-tabs.d-flex{flex-wrap:nowrap!important;overflow-x:auto!important;height:auto!important;padding:10px!important;gap:8px!important;scrollbar-width:none}
  .stage-tabs.d-flex::-webkit-scrollbar{display:none}
  .stage-tabs.d-flex .stage-tab{flex:0 0 auto!important;width:auto!important;white-space:nowrap!important}
}
@media (max-width:899px){
  .search-bar{width:40px!important;height:40px!important;padding:0!important;border-radius:50%!important;justify-content:center!important}
  .search-input{display:none!important}
  .logo-area{width:auto!important}
  /* grids collapse to fewer columns */
  .reco-grid,.outcomes-grid,.stats-row,.diagnosis-metrics-row{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .row>[class*="col-md-6"]{flex:0 0 100%;max-width:100%}
}
@media (max-width:600px){
  .main-content,.main{padding-left:12px!important;padding-right:12px!important}
  /* Medical Diagnosis Summary */
  .summary-header-row{flex-wrap:wrap!important;gap:12px!important}
  .section-header{min-width:0}.section-title-group{min-width:0;flex:1}
  .meta-info-bar{flex-direction:column!important;align-items:stretch!important;gap:10px!important}
  .meta-item{border:0!important;padding:0!important}
  .diagnosis-main-row,.treatment-main-row{flex-direction:column!important;align-items:flex-start!important;gap:12px!important}
  .reco-grid,.outcomes-grid,.stats-row,.diagnosis-metrics-row{grid-template-columns:1fr!important;display:grid!important}
  /* Journey tabs (Discharge / Post Care / After discharge): one scrollable row */
  /* Booking stepper (Doctor listing / Booking / Confirmed): fits the screen */
  .progress-steps{min-width:0!important;width:100%!important;gap:4px!important;height:auto!important}
  .progress-steps .step-divider,.progress-steps [class*="line"],.progress-steps [class*="connector"]{flex:1 1 8px!important;min-width:8px!important;width:auto!important}
  .progress-steps .step{flex:0 1 auto!important;min-width:0!important;gap:6px!important}
  .progress-steps .step-info{min-width:0!important}
  .progress-steps .step-circle{width:26px!important;height:26px!important;flex:none!important}
  .progress-steps [class*="sub"],.progress-steps [class*="status"]{display:none!important}
  .progress-steps [class*="label"],.progress-steps [class*="title"]{font-size:11px!important;line-height:14px!important;white-space:normal!important}
  /* Hospital photo strip scrolls inside its own row */
  .thumbs,.thumbs-row,.thumb-row,.thumbnails,.thumb-strip{overflow-x:auto!important;flex-wrap:nowrap!important}
  /* Tables scroll inside their card instead of widening the page */
  table{display:block;max-width:100%;overflow-x:auto}
  /* Fixed bottom action bars stack neatly */
  .bottom-bar,.action-bar,.footer-bar,.sticky-footer{flex-wrap:wrap!important;gap:8px!important}
  .welcome-text{font-size:18px!important}
  h1,.page-title,.pkg-title{word-break:break-word}
}
</style>

<script>

/* ---------- Session (shared with login / register / chat) ---------- */
var KEY='onecare:portal';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function save(p){var n=Object.assign(load(),p);try{localStorage.setItem(KEY,JSON.stringify(n))}catch(e){}return n}
function intent(){try{return JSON.parse(sessionStorage.getItem('onecare:intent')||'null')}catch(e){return null}}
var s=load();
if(!s.loggedIn){location.replace('login.html');}
var profile=s.profile||{};
var first=(profile.name||'Michael').split(' ')[0];
document.getElementById('welcome').textContent=first?('Welcome '+first+'!'):'Welcome!';
document.getElementById('userName').textContent=profile.name||'Michael';
document.getElementById('userId').textContent=s.registered?('Patient ID: '+s.patientId):'Registration pending';
if(s.registered){var bd=document.getElementById('bellDot');if(bd)bd.remove();}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show')},2400);}
document.getElementById('bell').addEventListener('click',function(){toast(s.registered?'No new notifications':'Reminder: complete your registration to unlock packages and doctors');});
document.getElementById('portalSearch').addEventListener('keydown',function(e){if(e.key==='Enter'&&this.value.trim())location.href='hospitals.html?q='+encodeURIComponent(this.value.trim());});
document.getElementById('logout').addEventListener('click',function(){save({loggedIn:false});location.href='login.html';});
/* ---------- Collapsible sidebar toggle (from jury dashboard) ---------- */
(function(){
  var toggle=document.getElementById('menuToggle');
  var sidebar=document.querySelector('.sidebar');
  var overlay=document.getElementById('sidebarOverlay');
  function openSidebar(){sidebar.classList.add('open');overlay.classList.add('active');toggle.classList.add('open');document.body.style.overflow='hidden';}
  function closeSidebar(){sidebar.classList.remove('open');overlay.classList.remove('active');toggle.classList.remove('open');document.body.style.overflow='';}
  toggle.addEventListener('click',function(){sidebar.classList.contains('open')?closeSidebar():openSidebar();});
  overlay.addEventListener('click',closeSidebar);
  document.querySelectorAll('.nav-item').forEach(function(item){item.addEventListener('click',function(){if(window.innerWidth<=1100)closeSidebar();});});
})();

/* ---------- Progress card (same markup as jury dashboard) ---------- */
var STEPS=['Profile','Medical','Documents','Lifestyle','Complete'];
function progressCard(done){
  var pct=Math.round(done/5*100);
  return '<div class="progress-card"><div class="progress-card-inner">'+
    '<div class="step-counter-row"><span class="step-counter-label">Step '+done+' of 5</span><span class="step-percent">'+pct+'%</span></div>'+
    '<div class="progress-bar-track"><div class="progress-bar-fill" style="width:'+Math.max(pct,4)+'%"></div></div>'+
    '<div class="step-indicators">'+STEPS.map(function(n,i){var st=i<done?'':' todo';return '<div class="step-indicator'+st+'"><div class="step-circle-num'+st+'"><span>'+(i+1)+'</span></div><span class="step-name">'+n+'</span></div>'}).join('')+
    '</div></div></div>';
}
var ARROW='<svg width="24" height="24" viewBox="0 0 24 24" fill="none">         <polyline points="5,12 19,12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>         <polyline points="13,6 19,12 13,18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>       </svg>';
var main=document.getElementById('main');
if(s.registered&&s.consultDone){
  /* After the video consultation the dashboard is the Medical Diagnosis Summary */
  location.replace('consultation-summary.html');
} else if(s.registered){
  /* Completed — identical to jury dashboard-screen.html */
  main.innerHTML='<p class="reg-success-heading">You have successfully completed all the registration steps.</p>'+progressCard(5)+
  '<div class="consultation-section"><p class="consult-heading">Click below to begin your consultation with the doctor.</p>'+
  '<p class="consult-subheading">Please complete the following steps before proceeding.</p>'+
  '<div class="consult-steps"><span class="consult-step-item">Choose the doctor from the doctor listing</span><span class="consult-step-item">Select time and date to book your slot</span><span class="consult-step-item">Pay the consultation fees</span><span class="consult-step-item">Get the video link for consultation</span></div>'+
  '<a class="start-btn" href="Doctor-Listing_2.html"><span class="start-btn-label">Start</span>'+ARROW+'</a></div>';
} else {
  /* Pending — Figma frames 11/12 in the jury dashboard style */
  var done=s.stepDone||0, it=intent();
  var tasks=['Complete your profile','Fill in the medical details','Upload medical documents','Fill in the lifestyle and travel preferences'];
  main.innerHTML='<div class="dash-grid"><div>'+
    (it?'<div class="intent-banner">You are one step away from booking'+(it.title?': <b>'+it.title.replace(/^Get Started — /,'')+'</b>':' your consultation')+'. Complete registration so our team can review your case.</div>':'')+
    progressCard(done)+
    '<div class="consultation-section"><p class="consult-heading">Please complete your registration before moving forward.</p>'+
    '<ol class="consult-steps">'+tasks.map(function(t,i){return '<li class="consult-step-item'+(i<done?' done':'')+'">'+t+'</li>'}).join('')+'</ol>'+
    '<a class="start-btn" href="register.html?step='+Math.min(done+1,5)+'"><span class="start-btn-label">'+(done?'Continue':'Start')+'</span>'+ARROW+'</a></div></div>'+
    '<aside class="ai-card"><h3>Introducing OneCare AI</h3><p>You can interact with our AI to learn more about our packages and payment milestones, helping you understand our services in detail.</p>'+
    '<a class="start-btn" href="chat.html"><span class="start-btn-label">Chat with AI</span>'+ARROW+'</a></aside></div>';
}

/* ---------- Chat bubble pop-over ---------- */
var bubble=document.getElementById('chatBubble'),pop=document.getElementById('fabPop');
bubble.addEventListener('click',function(e){e.stopPropagation();var o=pop.classList.toggle('open');bubble.setAttribute('aria-expanded',o);});
document.addEventListener('click',function(e){if(!e.target.closest('#fabPop')){pop.classList.remove('open');bubble.setAttribute('aria-expanded','false');}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')pop.classList.remove('open');});

</script>
<script id="oc-connect">
/* ===== OneCare — connect every portal screen (sidebar, header, journey tabs, flow buttons) ===== */
(function(){
  var page=decodeURIComponent((location.pathname.split('/').pop()||'').split('?')[0]);
  function go(url){location.href=url;}
  var NAV={'dashboard':'dashboard.html','package selection':'package-selection.html','payments':'viewpayment.html','my journey':'arrival_trial.html',
           'medical records':'discharge.html','hospitals & doctors':'Doctor-Listing_2.html','appointments':'booking-confirmed.html',
           'messages':'chat.html','support':'chat.html?topic=support'};
  var STAGES={'pre-arrival':'consultation-summary.html','arrival in india':'arrival_trial.html','treatments':'treatment_trial.html','treatment':'treatment_trial.html',
              'recovery':'recovery_trial.html','discharge':(function(){try{return sessionStorage.getItem('onecare:dischargePaid')?'afterdischarge.html':'discharge.html'}catch(e){return 'discharge.html'}})(),
              'post care':'postcare.html','post-care':'postcare.html'};
  var norm=function(t){return (t||'').replace(/\s+/g,' ').trim().toLowerCase();};
  function bind(el,url,delay){
    if(!el||el.__oc)return; el.__oc=1; el.style.cursor='pointer';
    el.addEventListener('click',function(e){
      if(e.target.closest('input,select,textarea'))return;
      e.preventDefault(); e.stopImmediatePropagation();
      if(url.split('?')[0]===page&&!delay)return;
      delay?setTimeout(function(){go(url)},delay):go(url);
    },true);
  }
  /* Session: show the logged-in patient everywhere */
  var s={};try{s=JSON.parse(localStorage.getItem('onecare:portal')||'{}')}catch(e){}
  if(!(s.profile&&s.profile.name)){s.profile=Object.assign({},s.profile,{name:'Michael'});}
  if(s.profile&&s.profile.name){document.querySelectorAll('.user-name').forEach(function(n){n.textContent=s.profile.name});
    var first=s.profile.name.split(' ')[0];document.querySelectorAll('.welcome-text').forEach(function(w){w.textContent='Welcome '+first+'!'});}
  if(s.patientId)document.querySelectorAll('.user-id').forEach(function(n){n.textContent='Patient ID: '+s.patientId});

  /* Sidebar */
  document.querySelectorAll('.sidebar .nav-item, .sidebar-nav .nav-item, nav .nav-item').forEach(function(item){
    var label=norm((item.querySelector('.nav-label')||item).textContent);
    if(NAV[label])bind(item,NAV[label]);
  });
  /* Header: logo, bell, logout, chat bubble */
  document.querySelectorAll('.logo-area').forEach(function(l){bind(l,'dashboard.html')});
  document.querySelectorAll('.logout-btn,#logoutBtn').forEach(function(b){
    if(b.__oc)return;b.__oc=1;b.style.cursor='pointer';
    b.addEventListener('click',function(e){e.preventDefault();e.stopImmediatePropagation();
      try{var st=JSON.parse(localStorage.getItem('onecare:portal')||'{}');st.loggedIn=false;localStorage.setItem('onecare:portal',JSON.stringify(st))}catch(err){}
      go('login.html');},true);
  });
  if(page!=='dashboard.html')document.querySelectorAll('.chat-bubble').forEach(function(c){bind(c,'chat.html')});
  document.querySelectorAll('.bell-btn').forEach(function(b){
    if(b.__oc||b.id==='bell')return;b.__oc=1;
    b.addEventListener('click',function(){ocToast('No new notifications')});
  });

  /* Journey stage tabs (all My Journey screens) */
  document.querySelectorAll('.stage-tabs .stage-tab, .stage-tabs button, .stage-tabs a, .tabs-row button, .tabs-row a').forEach(function(t){
    var k=norm(t.textContent); if(STAGES[k])bind(t,STAGES[k]);
  });

  /* Flow buttons — matched by their visible text, per screen */
  var RULES={
    'screen1_main.html':[['back to add-on services','package-selection.html']],
    'screen2_main.html':[['back to city selection','screen1_main.html'],['view details','screen3_main.html'],['proceed to room selection','deposit-payment.html',1300]],
    'screen3_main.html':[['back to hospitals','screen2_main.html'],['continue','deposit-payment.html',0,'#selectModal']],
    'Doctor-Listing_2.html':[['book consultation','booking-screen.html'],['view full profile','booking-screen.html']],
    'booking-confirmed.html':[['back to dashboard','dashboard.html']],
    'payment.html':[['go to my journey page','afterdischarge.html']]
  }[page]||[];
  RULES.forEach(function(r){
    var scope=r[3]?document.querySelector(r[3]):document;
    if(!scope)return;
    scope.querySelectorAll('button,a,[class*="btn"],[onclick]').forEach(function(b){
      if(b.closest('.sidebar'))return;
      if(b.parentElement&&b.parentElement.closest('button,a'))return;
      if(norm(b.textContent)===r[0])bind(b,r[1],r[2]);
    });
  });
  if(page==='package-selection.html'){
    var sub=document.querySelector('.pkg-subtitle');
    if(sub&&!document.getElementById('ocBrowse')){var a=document.createElement('a');a.id='ocBrowse';a.href='screen1_main.html';
      a.textContent='Prefer to compare hospitals city by city? Browse hospitals by city →';
      a.style.cssText='display:inline-block;margin-top:8px;font:600 13px "Open Sans",sans-serif;color:#0B1956;text-decoration:underline';
      sub.insertAdjacentElement('afterend',a);}
  }
  if(page==='afterdischarge.html'){try{sessionStorage.setItem('onecare:dischargePaid','1')}catch(e){}}
  if(page==='booking-confirmed.html'){
    document.querySelectorAll('button,a,[class*="btn"]').forEach(function(b){
      if(norm(b.textContent)==='join video consultation'&&!b.__oc){b.__oc=1;b.style.cursor='pointer';
        b.addEventListener('click',function(e){e.preventDefault();e.stopImmediatePropagation();ocToast('Joining your video consultation… When the call ends you will see the consultation summary on your dashboard.');try{var st=JSON.parse(localStorage.getItem('onecare:portal')||'{}');st.loggedIn=true;st.registered=true;st.consultDone=true;st.consult={doctor:'Dr. Rajesh Kumar',date:'3/16/2026',time:'12:00 PM'};localStorage.setItem('onecare:portal',JSON.stringify(st))}catch(err){}setTimeout(function(){go('consultation-summary.html')},2200);},true);}
    });
  }
  /* Tiny toast */
  function ocToast(m){var t=document.getElementById('ocToast');if(!t){t=document.createElement('div');t.id='ocToast';
    t.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#050B24;color:#fff;padding:12px 20px;border-radius:12px;font:14px "Open Sans",sans-serif;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center';document.body.appendChild(t);}
    t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0'},2600);}
  window.ocToast=window.ocToast||ocToast;
})();
</script>
</body>
